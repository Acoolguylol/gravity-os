name: Build GravityOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        pacman -Syu --noconfirm archiso git make base-devel

    - name: Build ISO
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gravity-os-iso
        path: out/*.iso
        compression-level: 0 # ISO is already compressed
